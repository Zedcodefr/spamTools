# Déploiement. Préparer deploy/.env (voir deploy/.env.example), puis :
#   docker compose --env-file deploy/.env up -d --build
#   docker compose --env-file deploy/.env run --rm app sync --all
#   docker compose --env-file deploy/.env run --rm app create-admin <identifiant>   (premier compte)
# Démarrage automatique : « restart: unless-stopped » relance le conteneur au démarrage de Docker
# (service docker activé au boot : systemctl enable docker).
#
# Deux façons d'exposer l'application en HTTPS :
#   - derrière un reverse proxy existant (nginx de mailcow, voir deploy/nginx/spamtools.conf) :
#     SPAMTOOLS_BIND désigne l'adresse où le proxy la joint ;
#   - avec Caddy fourni ici (certificat automatique) : ajouter --profile caddy.
name: spamtools

services:
  app:
    build: .
    image: spamtools:latest
    restart: unless-stopped
    environment:
      # Derrière un reverse proxy (nginx, Caddy) : adresse du client dans X-Forwarded-For.
      SPAMTOOLS_TRUST_PROXY: "1"
      # Adresse publique, pour les liens affichés par « create-admin ».
      SPAMTOOLS_PUBLIC_URL: ${SPAMTOOLS_PUBLIC_URL:-}
    volumes:
      - spamtools-data:/data
    # Jamais 0.0.0.0 : l'application ne doit être joignable que par le reverse proxy.
    ports:
      - "${SPAMTOOLS_BIND:-127.0.0.1:3100}:3000"
    # Aussi dans le Dockerfile ; repris ici pour les moteurs qui l'ignorent (images au format OCI, Podman).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    profiles: [caddy]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Obligatoire avec ce profil : Caddy refuse de démarrer sans domaine.
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  spamtools-data:
  caddy-data:
  caddy-config:
