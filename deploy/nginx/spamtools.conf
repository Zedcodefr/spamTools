# Vhost pour le nginx de mailcow (copier dans /opt/mailcow-dockerized/data/conf/nginx/).
# Le certificat est celui de mailcow : ajouter spamtools.fr,www.spamtools.fr à ADDITIONAL_SAN
# dans mailcow.conf. L'application écoute sur host.docker.internal:3100 (SPAMTOOLS_BIND).
server {
    listen 80;
    server_name spamtools.fr www.spamtools.fr;
    root /web;
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
    }
    location / {
        return 301 https://spamtools.fr$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.spamtools.fr;
    ssl_certificate     /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;
    return 301 https://spamtools.fr$request_uri;
}

server {
    listen 443 ssl http2;
    server_name spamtools.fr;
    ssl_certificate     /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass          http://host.docker.internal:3100;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        # La recherche de decks prend jusqu'à quelques secondes.
        proxy_read_timeout  60s;
    }
}
